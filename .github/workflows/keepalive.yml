name: 예약 자동화 비활성화 방지

# 공개 저장소가 60일 동안 활동이 없으면 GitHub가 예약 워크플로를 끄므로,
# 30일마다 작은 상태 파일을 갱신해 저장소 활동을 유지한다.
on:
  schedule:
    - cron: "37 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 예약 자동화 활동 기록 갱신
        run: |
          mkdir -p .github
          printf 'Last scheduled-automation keepalive: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .github/scheduled-automation-keepalive.txt

      - name: 변경사항 커밋 및 전송
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scheduled-automation-keepalive.txt
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: keep scheduled automations active"
          git push
