name: G2B 잔디보호매트 납품요구 모니터링 (09:05·13:05·17:05)

on:
  schedule:
    # 평일 09:05 / 13:05 / 17:05 KST
    # = 00:05 / 04:05 / 08:05 UTC
    # 정각의 GitHub Actions 혼잡 시간을 피하기 위해 5분 늦춘다.
    # 파일명을 v2로 변경해 GitHub에 남아 있던 이전 예약값을 폐기하고 재등록한다.
    # 월~금만 실행하고, 한국 공휴일은 아래 단계에서 추가로 제외한다.
    - cron: "5 0 * * 1-5"
    - cron: "5 4 * * 1-5"
    - cron: "5 8 * * 1-5"

  workflow_dispatch:
    inputs:
      debug:
        description: "디버그 모드로 실행 (raw 응답만 출력, 저장/알림 없음)"
        required: false
        default: "false"

      test_telegram:
        description: "텔레그램 설정만 점검 (테스트 메시지 1건 발송 후 종료)"
        required: false
        type: boolean
        default: false

      preview:
        description: "최근 N건을 현재 알림 형식으로 다시 발송 (저장 안 함). 예: 3"
        required: false
        default: ""

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests firebase-admin holidays

      - name: 한국 공휴일·알림 허용시간 확인
        id: guard
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import holidays

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          today = now.date()
          kr_holidays = holidays.KR(years=today.year)
          is_holiday = today in kr_holidays
          is_weekday = now.weekday() < 5
          is_work_hours = 8 <= now.hour < 18
          allowed = is_weekday and not is_holiday and is_work_hours

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"allowed={'true' if allowed else 'false'}\n")

          if is_holiday:
              print(f"[INFO] {today} 공휴일 ({kr_holidays.get(today)}) - 알림을 차단합니다.")
          elif not is_weekday:
              print(f"[INFO] {today} 주말 - 알림을 차단합니다.")
          elif not is_work_hours:
              print(f"[INFO] {now:%Y-%m-%d %H:%M} KST 허용시간(08:00~18:00) 밖 - 알림을 차단합니다.")
          else:
              print(f"[INFO] {now:%Y-%m-%d %H:%M} KST 알림 허용시간 - 조회를 진행합니다.")
          PY

      - name: 모니터링 실행
        if: steps.guard.outputs.allowed == 'true'
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}

          # 서울 리전(Vercel)에서 도는 프록시를 거쳐 apis.data.go.kr을 호출한다.
          # 둘 중 하나라도 비어 있으면 스크립트가 직접 호출로 돌아간다.
          G2B_PROXY_URL: ${{ secrets.G2B_PROXY_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

          PREVIEW_N: ${{ github.event.inputs.preview }}

        run: |
          if [ "${{ github.event.inputs.test_telegram }}" = "true" ]; then
            python scripts/g2b_delivery_monitor.py --test-telegram

          elif [ -n "$PREVIEW_N" ]; then
            python scripts/g2b_delivery_monitor.py --preview "$PREVIEW_N" --days 30

          elif [ "${{ github.event.inputs.debug }}" = "true" ]; then
            python scripts/g2b_delivery_monitor.py --debug

          else
            python scripts/g2b_delivery_monitor.py
          fi
