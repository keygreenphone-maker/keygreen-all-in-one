def _firestore_rest_auth():
    """서비스 계정으로 Firestore REST API용 토큰 발급."""

    from google.oauth2 import service_account
    from google.auth.transport.requests import Request

    info = json.loads(
        FIREBASE_SERVICE_ACCOUNT_JSON
    )

    creds = (
        service_account
        .Credentials
        .from_service_account_info(
            info,
            scopes=[
                "https://www.googleapis.com/auth/datastore"
            ],
        )
    )

    creds.refresh(Request())

    return info["project_id"], creds.token


def _firestore_doc_url(
    project_id: str,
    document_path: str,
) -> str:

    path = "/".join(
        urllib.parse.quote(
            part,
            safe=""
        )
        for part in document_path.split("/")
    )

    return (
        "https://firestore.googleapis.com/v1/"
        f"projects/{project_id}/"
        "databases/(default)/documents/"
        f"{path}"
    )


def _firestore_collection_url(
    project_id: str,
    collection: str,
) -> str:

    return (
        "https://firestore.googleapis.com/v1/"
        f"projects/{project_id}/"
        "databases/(default)/documents/"
        f"{urllib.parse.quote(collection, safe='')}"
    )


def _to_firestore_value(value):
    """Python 값을 Firestore REST 필드 형식으로 변환."""

    if value is None:
        return {"nullValue": None}

    if isinstance(value, bool):
        return {
            "booleanValue": value
        }

    if isinstance(value, int):
        return {
            "integerValue": str(value)
        }

    if isinstance(value, float):
        return {
            "doubleValue": value
        }

    if isinstance(value, list):
        return {
            "arrayValue": {
                "values": [
                    _to_firestore_value(v)
                    for v in value
                ]
            }
        }

    if isinstance(value, dict):
        return {
            "mapValue": {
                "fields": {
                    str(k):
                    _to_firestore_value(v)
                    for k, v
                    in value.items()
                }
            }
        }

    return {
        "stringValue": str(value)
    }


def load_seen_ids_rest():
    """REST API 방식으로 seenIds 읽기."""

    project_id, token = (
        _firestore_rest_auth()
    )

    url = _firestore_doc_url(
        project_id,
        FIRESTORE_STATE_DOC,
    )

    resp = requests.get(
        url,
        headers={
            "Authorization":
            f"Bearer {token}"
        },
        timeout=20,
    )

    if resp.status_code == 404:
        print(
            "[WARN] 기존 seenIds 문서 없음"
        )
        return set()

    resp.raise_for_status()

    data = resp.json()

    values = (
        data
        .get("fields", {})
        .get("ids", {})
        .get("arrayValue", {})
        .get("values", [])
    )

    return {
        v.get("stringValue")
        for v in values
        if v.get("stringValue")
    }


def save_seen_ids_rest(seen_ids):
    """REST API 방식으로 seenIds 저장."""

    project_id, token = (
        _firestore_rest_auth()
    )

    url = _firestore_doc_url(
        project_id,
        FIRESTORE_STATE_DOC,
    )

    trimmed = sorted(
        seen_ids
    )[-3000:]

    body = {
        "fields": {
            "ids": {
                "arrayValue": {
                    "values": [
                        {
                            "stringValue":
                            item_id
                        }
                        for item_id
                        in trimmed
                    ]
                }
            },
            "updatedAt": {
                "stringValue":
                datetime.datetime
                .utcnow()
                .isoformat()
            },
        }
    }

    resp = requests.patch(
        url,
        headers={
            "Authorization":
            f"Bearer {token}",
            "Content-Type":
            "application/json",
        },
        json=body,
        timeout=20,
    )

    resp.raise_for_status()


def save_delivery_rest(item):
    """REST API 방식으로 deliveryRequests 저장."""

    project_id, token = (
        _firestore_rest_auth()
    )

    url = _firestore_collection_url(
        project_id,
        FIRESTORE_COLLECTION,
    )

    data = {
        **item,
        "notifiedAt":
        datetime.datetime
        .utcnow()
        .isoformat(),
    }

    body = {
        "fields": {
            str(k):
            _to_firestore_value(v)
            for k, v
            in data.items()
        }
    }

    resp = requests.post(
        url,
        headers={
            "Authorization":
            f"Bearer {token}",
            "Content-Type":
            "application/json",
        },
        json=body,
        timeout=20,
    )

    resp.raise_for_status()


# ──────────────────────────────────────────────────────────────────────
# Firestore SDK + 자동 fallback
# ──────────────────────────────────────────────────────────────────────

def load_seen_ids(db):
    try:
        doc = (
            db
            .document(
                FIRESTORE_STATE_DOC
            )
            .get()
        )

        if doc.exists:
            print(
                "[INFO] Firestore SDK 읽기 정상"
            )

            return set(
                doc
                .to_dict()
                .get("ids", [])
            )

        return set()

    except Exception as e:
        print(
            f"[WARN] Firestore SDK 읽기 실패: {e}"
        )

        print(
            "[WARN] Firestore REST "
            "백업 모드로 전환합니다."
        )

        return load_seen_ids_rest()


def save_seen_ids(
    db,
    seen_ids,
):
    trimmed = sorted(
        seen_ids
    )[-3000:]

    try:
        db.document(
            FIRESTORE_STATE_DOC
        ).set({
            "ids": trimmed,
            "updatedAt":
            datetime.datetime
            .utcnow()
            .isoformat(),
        })

    except Exception as e:
        print(
            f"[WARN] Firestore SDK "
            f"상태 저장 실패: {e}"
        )

        print(
            "[WARN] REST 방식으로 "
            "seenIds를 저장합니다."
        )

        save_seen_ids_rest(
            seen_ids
        )


def save_delivery(
    db,
    item,
):
    data = {
        **item,
        "notifiedAt":
        datetime.datetime
        .utcnow()
        .isoformat(),
    }

    try:
        db.collection(
            FIRESTORE_COLLECTION
        ).add(data)

    except Exception as e:
        print(
            f"[WARN] Firestore SDK "
            f"발주 저장 실패: {e}"
        )

        print(
            "[WARN] REST 방식으로 "
            "발주 데이터를 저장합니다."
        )

        save_delivery_rest(
            item
        )


