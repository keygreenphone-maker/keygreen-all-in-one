# ── 공공데이터포털 API 설정 ─────────────────────────────────────────────
G2B_API_BASE = "https://apis.data.go.kr/1230000/at/ShoppingMallPrdctInfoService"
OPERATION = "getSpcifyPrdlstPrcureInfoList"

DTIL_PRDCT_CLSFC_NO = "3012189301"

G2B_SERVICE_KEY = urllib.parse.unquote(
    os.environ.get("G2B_SERVICE_KEY", "")
)

G2B_PROXY_URL = os.environ.get("G2B_PROXY_URL", "")
PROXY_SECRET = os.environ.get("PROXY_SECRET", "")


_session = requests.Session()
_session.mount(
    "https://",
    HTTPAdapter(
        max_retries=Retry(
            total=4,
            connect=4,
            read=2,
            backoff_factor=3,
            status_forcelist=[429, 500, 502, 503, 504],
            allowed_methods=["GET"],
        )
    ),
)


# ── 텔레그램 설정 ──────────────────────────────────────────────────────
TELEGRAM_BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")


# ── Firebase 설정 ──────────────────────────────────────────────────────
FIREBASE_SERVICE_ACCOUNT_JSON = os.environ.get(
    "FIREBASE_SERVICE_ACCOUNT", ""
)

FIRESTORE_COLLECTION = "deliveryRequests"
FIRESTORE_STATE_DOC = "g2bMonitorState/seenIds"


# ──────────────────────────────────────────────────────────────────────
# G2B 조회
# ──────────────────────────────────────────────────────────────────────

def _fetch_page(begin_date: str, end_date: str, page: int, debug: bool = False):
    """한 페이지를 조회해 (items, totalCount)를 돌려준다."""

    params = {
        "serviceKey": G2B_SERVICE_KEY,
        "pageNo": str(page),
        "numOfRows": "100",
        "type": "json",
        "inqryDiv": "1",
        "inqryBgnDate": begin_date,
        "inqryEndDate": end_date,
        "inqryPrdctDiv": "2",
        "dtilPrdctClsfcNo": DTIL_PRDCT_CLSFC_NO,
    }

    use_proxy = bool(G2B_PROXY_URL and PROXY_SECRET)

    if use_proxy:
        url = G2B_PROXY_URL

        resp = _session.get(
            url,
            params={**params, "op": OPERATION},
            headers={"x-proxy-key": PROXY_SECRET},
            timeout=(15, 30),
        )

    else:
        url = f"{G2B_API_BASE}/{OPERATION}"

        resp = _session.get(
            url,
            params=params,
            timeout=(15, 30),
        )

    if debug:
        print(f"\n[DEBUG] GET {resp.url}")
        print(f"[DEBUG] status={resp.status_code}")
        print(resp.text[:3000])

    try:
        data = resp.json()

    except ValueError:
        print(
            f"[ERROR] JSON이 아닌 응답 "
            f"(status={resp.status_code}, page={page}):"
        )

        print(resp.text[:1000])
        resp.raise_for_status()
        raise

    if "OpenAPI_ServiceResponse" in data:
        hdr = data["OpenAPI_ServiceResponse"].get(
            "cmmMsgHeader", {}
        )

        raise RuntimeError(
            f"오픈API 오류: {hdr.get('errMsg')} / "
            f"{hdr.get('returnAuthMsg')} "
            f"(code={hdr.get('returnReasonCode')})"
        )

    header = data.get("response", {}).get("header", {})

    if header.get("resultCode") not in ("00", None):
        raise RuntimeError(
            f"오픈API 오류: "
            f"{header.get('resultCode')} "
            f"{header.get('resultMsg')}"
        )

    body = data.get("response", {}).get("body", {})

    total = int(body.get("totalCount") or 0)

    items = body.get("items")

    if not items:
        return [], total

    if isinstance(items, dict):
        item = items.get("item")

        if not item:
            return [], total

        return (
            item if isinstance(item, list) else [item]
        ), total

    if isinstance(items, list):
        return items, total

    return [], total


def fetch_delivery_requests(
    begin_date: str,
    end_date: str,
    debug: bool = False,
):
    """세부품명 '잔디보호매트' 전체 조달내역을 페이지 끝까지 조회."""

    if G2B_PROXY_URL and PROXY_SECRET:
        print(
            f"[INFO] G2B API 호출 경로: 프록시 "
            f"({G2B_PROXY_URL})"
        )

    else:
        print(
            f"[INFO] G2B API 호출 경로: 직접 호출 "
            f"({G2B_API_BASE})"
        )

    collected = []
    page = 1

    while True:
        items, total = _fetch_page(
            begin_date,
            end_date,
            page,
            debug=(debug and page == 1),
        )

        collected.extend(items)

        if not items or len(collected) >= total:
            return collected

        page += 1


