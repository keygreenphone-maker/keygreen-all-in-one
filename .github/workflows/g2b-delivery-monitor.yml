def send_telegram(
    text: str,
) -> bool:

    url = (
        "https://api.telegram.org/"
        f"bot{TELEGRAM_BOT_TOKEN}/"
        "sendMessage"
    )

    resp = requests.post(
        url,
        data={
            "chat_id":
            TELEGRAM_CHAT_ID,
            "text":
            text,
            "parse_mode":
            "HTML",
            "disable_web_page_preview":
            True,
        },
        timeout=10,
    )

    if resp.status_code != 200:
        print(
            f"[ERROR] 텔레그램 전송 실패: "
            f"{resp.status_code} "
            f"{resp.text}"
        )

        return False

    return True


