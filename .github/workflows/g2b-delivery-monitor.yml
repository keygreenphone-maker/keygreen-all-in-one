# main
# ──────────────────────────────────────────────────────────────────────

def main():

    parser = argparse.ArgumentParser()

    parser.add_argument(
        "--debug",
        action="store_true",
    )

    parser.add_argument(
        "--days",
        type=int,
        default=10,
    )

    parser.add_argument(
        "--dry-run",
        action="store_true",
    )

    parser.add_argument(
        "--test-telegram",
        action="store_true",
    )

    parser.add_argument(
        "--preview",
        type=int,
        metavar="N",
    )

    args = parser.parse_args()

    if (
        args.test_telegram
        or not (
            args.debug
            or args.dry_run
        )
    ):
        if not (
            TELEGRAM_BOT_TOKEN
            and TELEGRAM_CHAT_ID
        ):
            print(
                "[ERROR] "
                "TELEGRAM_BOT_TOKEN / "
                "TELEGRAM_CHAT_ID "
                "환경변수가 없습니다."
            )

            sys.exit(1)

    if args.test_telegram:
        kst = datetime.datetime.now(
            datetime.timezone(
                datetime.timedelta(
                    hours=9
                )
            )
        )

        if not send_telegram(
            "✅ 키그린 모니터링 설정 테스트\n"
            f"{kst:%Y-%m-%d %H:%M} KST"
        ):
            sys.exit(1)

        print(
            "[INFO] 테스트 메시지 "
            "발송 성공"
        )

        return

    if not G2B_SERVICE_KEY:
        print(
            "[ERROR] "
            "G2B_SERVICE_KEY "
            "환경변수가 없습니다."
        )

        sys.exit(1)

    today = datetime.date.today()

    begin_date = (
        today
        - datetime.timedelta(
            days=args.days
        )
    ).strftime("%Y%m%d")

    end_date = (
        today.strftime(
            "%Y%m%d"
        )
    )

    fetched = fetch_delivery_requests(
        begin_date,
        end_date,
        debug=args.debug,
    )

    all_items = [
        it
        for it in fetched
        if it.get("prdctIdntNo")
        in PRODUCT_IDS
    ]

    print(
        "[INFO] 잔디보호매트 전체 "
        f"{len(fetched)}건 중 "
        f"우리 품목 "
        f"{len(all_items)}건 "
        f"({begin_date}~{end_date})"
    )

    if args.debug:
        print(
            "[DEBUG] --debug 모드 종료"
        )
        return

    if args.dry_run:
        for item in all_items:
            print(
                format_telegram_message(
                    item
                )
            )
            print("---")

        return

    if args.preview:
        targets = sorted(
            all_items,
            key=lambda x:
            x.get(
                "cntrctDlvrReqDate"
            )
            or "",
            reverse=True,
        )[:args.preview]

        print(
            f"[INFO] 미리보기 "
            f"{len(targets)}건 발송"
        )

        failed = 0

        for item in targets:
            if not send_telegram(
                format_telegram_message(
                    item
                )
            ):
                failed += 1

        if failed:
            print(
                f"[ERROR] 미리보기 "
                f"발송 실패 "
                f"{failed}/"
                f"{len(targets)}건"
            )

            sys.exit(1)

        return

    # ── Firebase 연결 ──────────────────────────────────────────────

    import firebase_admin
    from firebase_admin import (
        credentials,
        firestore,
    )

    if not FIREBASE_SERVICE_ACCOUNT_JSON:
        print(
            "[ERROR] "
            "FIREBASE_SERVICE_ACCOUNT "
            "환경변수가 없습니다."
        )

        sys.exit(1)

    cred = credentials.Certificate(
        json.loads(
            FIREBASE_SERVICE_ACCOUNT_JSON
        )
    )

    firebase_admin.initialize_app(
        cred
    )

    db = firestore.client()

    # SDK 실패 시 REST fallback
    seen_ids = load_seen_ids(
        db
    )

    new_items = [
        item
        for item in all_items
        if get_item_key(item)
        not in seen_ids
    ]

    print(
        f"[INFO] 신규건 "
        f"{len(new_items)}건"
    )

    failed = 0

    for item in new_items:

        key = get_item_key(
            item
        )

        # Firestore에 먼저 저장
        # SDK 실패 시 REST 자동 우회
        try:
            save_delivery(
                db,
                item,
            )

        except Exception as e:
            print(
                "[ERROR] 발주 데이터 "
                f"Firestore 저장 실패: {e}"
            )

            # 저장 실패한 건은
            # 텔레그램도 보내지 않음
            # 다음 실행 때 다시 시도하게 함
            failed += 1
            continue

        # Firestore 저장 성공 후
        # 텔레그램 발송
        if not send_telegram(
            format_telegram_message(
                item
            )
        ):
            failed += 1
            continue

        # 저장 + 텔레그램 모두 성공한 건만
        # seen_ids에 추가
        seen_ids.add(
            key
        )

    if failed:
        print(
            "[ERROR] 일부 신규건 처리 실패 "
            f"{failed}/"
            f"{len(new_items)}건"
        )

        # 성공한 건의 seen_ids는 저장해서
        # 다음 실행에서 중복 알림 방지
        try:
            save_seen_ids(
                db,
                seen_ids,
            )

        except Exception as e:
            print(
                "[ERROR] seenIds 저장 실패: "
                f"{e}"
            )

        sys.exit(1)

    if new_items:
        save_seen_ids(
            db,
            seen_ids,
        )

    else:
        if not send_telegram(
            format_heartbeat_message(
                begin_date,
                end_date,
                len(fetched),
                len(all_items),
            )
        ):
            print(
                "[WARN] 점검 완료 메시지 "
                "전송 실패"
            )

    print(
        "[INFO] 완료"
    )


if __name__ == "__main__":
    main()
