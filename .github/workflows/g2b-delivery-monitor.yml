def _to_int(v):
    try:
        return int(float(v))

    except (
        TypeError,
        ValueError,
    ):
        return None


def _fmt_num(
    v,
    signed: bool = False,
) -> str:

    n = _to_int(v)

    if n is None:
        return (
            str(v)
            if v not in (None, "")
            else "-"
        )

    return (
        f"{n:+,}"
        if signed
        else f"{n:,}"
    )


def _fmt_date(v) -> str:
    s = str(v or "")

    if (
        len(s) == 8
        and s.isdigit()
    ):
        return (
            f"{s[:4]}-"
            f"{s[4:6]}-"
            f"{s[6:8]}"
        )

    return s or "-"


def format_heartbeat_message(
    begin_date: str,
    end_date: str,
    total_checked: int,
    our_count: int,
) -> str:

    kst = datetime.datetime.now(
        datetime.timezone(
            datetime.timedelta(
                hours=9
            )
        )
    )

    return (
        "✅ <b>납품요구 점검 완료</b> · 신규 없음\n"
        f"{kst:%Y-%m-%d %H:%M} KST\n"
        f"조회범위 "
        f"{_fmt_date(begin_date)}"
        f"~{_fmt_date(end_date)}"
        f" (전체 {total_checked}건 중 "
        f"우리 품목 {our_count}건)"
    )


def format_telegram_message(
    item: dict,
) -> str:

    name = (
        item.get("prdctIdntNoNm")
        or item.get("dtilPrdctClsfcNoNm")
        or "품명미상"
    )

    org = (
        item.get("dminsttNm")
        or "-"
    )

    region = (
        item.get("dminsttRgnNm")
        or ""
    )

    company = (
        item.get("corpNm")
        or "-"
    )

    unit = (
        item.get("prdctUnit")
        or ""
    )

    title = (
        item.get("cntrctDlvrReqNm")
        or "-"
    )

    no = (
        item.get("cntrctDlvrReqNo")
        or "-"
    )

    chg = (
        item.get(
            "cntrctDlvrReqChgOrd"
        )
        or "00"
    ).strip()

    is_change = (
        chg not in ("", "00")
    )

    incdec = _to_int(
        item.get("incdecQty")
    )

    is_ours = (
        "키그린" in company
    )

    tag = (
        ""
        if is_ours
        else "[경쟁사] "
    )

    if not is_change:
        icon = (
            "🌱"
            if is_ours
            else "👀"
        )

        header = (
            f"{icon} "
            f"<b>{tag}"
            "잔디보호매트 신규 납품요구"
            "</b>"
        )

    elif (
        incdec is not None
        and incdec < 0
    ):
        kind = (
            "전량취소"
            if _to_int(
                item.get("prdctQty")
            ) == 0
            else "감액"
        )

        header = (
            "⚠️ "
            f"<b>{tag}"
            "잔디보호매트 납품요구 "
            f"[변경 {chg}차 {kind}]"
            "</b>"
        )

    elif (
        incdec is not None
        and incdec > 0
    ):
        icon = (
            "🌱"
            if is_ours
            else "👀"
        )

        header = (
            f"{icon} "
            f"<b>{tag}"
            "잔디보호매트 납품요구 "
            f"[변경 {chg}차 증액]"
            "</b>"
        )

    else:
        icon = (
            "🌱"
            if is_ours
            else "👀"
        )

        header = (
            f"{icon} "
            f"<b>{tag}"
            "잔디보호매트 납품요구 "
            f"[변경 {chg}차]"
            "</b>"
        )

    lines = [
        header,
        f"품목: {name}",
        f"계약명: {title}",
        (
            f"수요기관: {org} ({region})"
            if region
            else f"수요기관: {org}"
        ),
        f"업체: {company}",
    ]

    if is_change:
        lines.append(
            "증감: "
            f"{_fmt_num(item.get('incdecQty'), signed=True)}"
            f"{unit}"
            " / "
            f"{_fmt_num(item.get('incdecAmt'), signed=True)}원"
        )

        lines.append(
            "누적: "
            f"{_fmt_num(item.get('prdctQty'))}"
            f"{unit}"
            " / "
            f"{_fmt_num(item.get('prdctAmt'))}원"
            " (최초 "
            f"{_fmt_date(item.get('IntlCntrctDlvrReqDate'))})"
        )

    else:
        lines.append(
            "수량/금액: "
            f"{_fmt_num(item.get('prdctQty'))}"
            f"{unit}"
            " / "
            f"{_fmt_num(item.get('prdctAmt'))}원"
        )

    lines.append(
        "납품요구일자: "
        f"{_fmt_date(item.get('cntrctDlvrReqDate'))}"
    )

    lines.append(
        f"납품요구번호: {no}"
    )

    return "\n".join(lines)


def get_item_key(
    item: dict,
) -> str:

    no = (
        item.get("cntrctDlvrReqNo")
        or ""
    )

    ord_ = (
        item.get("cntrctDlvrReqChgOrd")
        or ""
    )

    pid = (
        item.get("prdctIdntNo")
        or ""
    )

    sno = (
        item.get("prdctSno")
        or ""
    )

    return (
        f"{no}-"
        f"{ord_}-"
        f"{pid}-"
        f"{sno}"
    )


